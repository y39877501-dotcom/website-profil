<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piqri davinci - Personal Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0e;
            color: #ffffff;
        }
        /* Glowing effect for modern touch */
        .verified-badge {
            color: #3b82f6;
        }
        .social-card {
            background-color: #161618;
            border: 1px solid #26262a;
            transition: all 0.2s ease-in-out;
        }
        .social-card:hover {
            background-color: #1c1c1f;
            border-color: #3f3f46;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Main Container Layout (Matching Mobile Screenshot Mockup) -->
    <div class="w-full max-w-md bg-[#121214] sm:rounded-3xl border border-[#222226] overflow-hidden shadow-2xl min-h-screen sm:min-h-0">
        
        <!-- Header Banner Container -->
        <div class="relative w-full h-44 sm:h-48 overflow-hidden bg-gray-900">
            <!-- Banner Image (Gambar 3) -->
            <img src="banner.jpg" 
                 alt="Banner" 
                 class="w-full h-full object-cover"
                 onerror="this.src='https://placehold.co/600x200/1e1e24/fff?text=Banner+Image'">
            
            <!-- Tag Overlay inside Banner -->
            <div class="absolute bottom-3 left-4 bg-black/60 backdrop-blur-md text-gray-200 text-xs px-3 py-1 rounded-full font-medium border border-white/10">
                online-station
            </div>
        </div>

        <!-- Content Area -->
        <div class="px-6 pb-8">
            
            <!-- Profile Avatar & Details Header Section -->
            <div class="relative flex items-end justify-between -mt-14 mb-4">
                <!-- Profile Picture (Gambar 2) -->
                <div class="relative">
                    <img src="profile.jpg" 
                         alt="Piqri davinci" 
                         class="w-24 h-24 rounded-full object-cover border-4 border-[#121214] shadow-md"
                         onerror="this.src='https://placehold.co/150x150/222/fff?text=Profile'">
                </div>
            </div>

            <!-- Name with Verified Blue Checkmark -->
            <div class="mb-3">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold tracking-tight text-white">Piqri davinci</h1>
                    <!-- Blue Check Icon -->
                    <svg class="w-5 h-5 verified-badge fill-current" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <p class="text-xs text-gray-400 font-normal mt-0.5">Personal Profile</p>
            </div>

            <!-- Bio text with aesthetic separator dot -->
            <p class="text-sm text-gray-300 leading-relaxed mb-3 font-normal">
                Kreator base <span class="inline-block mx-1 text-blue-400">✦</span> Programer
            </p>

            <!-- Location -->
            <div class="text-xs text-gray-400 mb-6 flex items-center gap-1.5">
                <span>Bekasi</span>
                <span>•</span>
                <span>Indonesia</span>
            </div>

            <!-- Divider Line -->
            <hr class="border-t border-[#222226] mb-6">

            <!-- Social Media Title Section -->
            <h2 class="text-base font-semibold text-white mb-4">Social Media</h2>

            <!-- Social Media Links Grid/List -->
            <div class="space-y-3">
                
                <!-- Instagram Link -->
                <a href="https://www.instagram.com/cournelisd?obrf=MWIzdHpuMjRzZG54eQ==" target="_blank" rel="noopener noreferrer" class="social-card flex items-center justify-between p-3.5 rounded-2xl group">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-[#202024] flex items-center justify-center text-white text-xl group-hover:scale-105 transition-transform">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">Instagram</h3>
                            <p class="text-xs text-gray-400">@cournelisd</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-sm group-hover:text-white transition-colors mr-1"></i>
                </a>

                <!-- WhatsApp Link -->
                <a href="https://wa.me/6285188410796" target="_blank" rel="noopener noreferrer" class="social-card flex items-center justify-between p-3.5 rounded-2xl group">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-[#202024] flex items-center justify-center text-white text-xl group-hover:scale-105 transition-transform">
                            <i class="fa-brands fa-whatsapp"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">WhatsApp</h3>
                            <p class="text-xs text-gray-400">Contact me</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-sm group-hover:text-white transition-colors mr-1"></i>
                </a>

                <!-- TikTok Link -->
                <a href="https://tiktok.com/@piqri.maybe" target="_blank" rel="noopener noreferrer" class="social-card flex items-center justify-between p-3.5 rounded-2xl group">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-[#202024] flex items-center justify-center text-white text-xl group-hover:scale-105 transition-transform">
                            <i class="fa-brands fa-tiktok"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">TikTok</h3>
                            <p class="text-xs text-gray-400">@piqri.maybe</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-sm group-hover:text-white transition-colors mr-1"></i>
                </a>

            </div>

            <!-- Footer minimalis -->
            <div class="mt-8 text-center text-[#44444c] text-xs font-medium">
                © 2026 Piqri davinci. All rights reserved.
            </div>

        </div>
    </div>

</body>
</html>
